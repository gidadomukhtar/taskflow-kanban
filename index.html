<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow v2</title>
<style>
:root{--bg:#0a0f1e;--card:#121827;--accent:#38bdf8;--text:#e5e7eb;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui}
.wrap{max-width:900px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:24px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{background:var(--card);border-radius:14px;padding:12px;border:1px solid #1e293b;min-height:300px}
.col h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;color:var(--muted)}
.task{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:10px;border-left:3px solid var(--accent)}
.task small{color:var(--muted);display:block;margin-top:6px}
.btns{display:flex;gap:6px;margin-top:8px}
.btns button{flex:1;padding:6px;border:0;border-radius:6px;background:#334155;color:var(--text);cursor:pointer;font-size:12px}
input,select,#add{width:100%;padding:10px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:var(--text);margin-bottom:8px}
#add{background:var(--accent);color:#0a0f1e;font-weight:700;border:0;cursor:pointer}
.stats{display:flex;gap:16px;margin:16px 0;font-size:13px;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>TaskFlow v2</h1><div class="stats"><span>Tasks: <b id="total">0</b></span><span>Done: <b id="done">0</b></span></div></header>
<div class="grid">
<div class="col" data-col="todo"><h3>Todo</h3></div>
<div class="col" data-col="prog"><h3>In Progress</h3></div>
<div class="col" data-col="done"><h3>Done</h3></div>
</div>
<div style="margin-top:16px;background:var(--card);padding:16px;border-radius:14px">
<input id="title" placeholder="Task title"><select id="priority"><option>Low</option><option>Med</option><option>High</option></select><button id="add">Add Task</button>
</div></div>
<script>
let tasks=JSON.parse(localStorage.getItem('tf2')||'[]');
const cols={todo:document.querySelector('[data-col=todo]'),prog:document.querySelector('[data-col=prog]'),done:document.querySelector('[data-col=done]')};
function save(){localStorage.setItem('tf2',JSON.stringify(tasks));updateStats()}
function updateStats(){total.textContent=tasks.length;done.textContent=tasks.filter(t=>t.col==='done').length}
function move(id,newCol){tasks=tasks.map(t=>t.id==id?{...t,col:newCol}:t);save();render()}
function del(id){tasks=tasks.filter(t=>t.id!=id);save();render()}
function render(){
Object.values(cols).forEach(c=>c.querySelectorAll('.task').forEach(t=>t.remove()));
tasks.forEach(t=>{
const div=document.createElement('div');div.className='task';div.dataset.id=t.id;
let btns='';
if(t.col==='todo')btns='<button onclick="move('+t.id+',\'prog\')">→ Progress</button><button onclick="del('+t.id+')">Delete</button>';
if(t.col==='prog')btns='<button onclick="move('+t.id+',\'todo\')">← Back</button><button onclick="move('+t.id+',\'done\')">✓ Done</button>';
if(t.col==='done')btns='<button onclick="move('+t.id+',\'prog\')">↺ Reopen</button><button onclick="del('+t.id+')">Delete</button>';
div.innerHTML=`${t.title}<small>${t.priority} • ${new Date(t.time).toLocaleDateString()}</small><div class="btns">${btns}</div>`;
cols[t.col].appendChild(div);
});
}
add.onclick=()=>{if(!title.value)return;tasks.push({id:Date.now(),title:title.value,priority:priority.value,col:'todo',time:Date.now()});title.value='';save();render()}
render();updateStats();
</script>
</body>
</html>
